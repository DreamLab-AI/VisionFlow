name: Diagrams-as-code index gate

on:
  push:
    branches: [main]
    paths:
      - 'docs/diagrams/**'
      - 'scripts/diagram-index-gen.cjs'
      - 'tests/gates/diagram-index.test.cjs'
      - '.github/workflows/diagram-index.yml'
  pull_request:
    paths:
      - 'docs/diagrams/**'
      - 'scripts/diagram-index-gen.cjs'
      - 'tests/gates/diagram-index.test.cjs'
      - '.github/workflows/diagram-index.yml'

jobs:
  index:
    name: Validate frontmatter, ids, block structure and the generated index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      # WHY THIS RUNNER DOES NOT RUN --strict-citations (decided 2026-09-21).
      #
      # `sources:` reach sixteen repositories at forty-one declared revisions, so
      # verifying a citation here would mean checking each of them out at the exact
      # sha its topic names. That was measured rather than assumed, and two of them
      # cannot be fetched at all: jjohare/visionGraph is private, and the RuView sha
      # the corpus declares exists only in a local clone. `--strict-citations`
      # refuses `--no-source-paths` and has no per-repository waiver, so those two
      # absences alone would raise ~48 `source path does not exist` errors and the
      # gate would be red from its first run. Making it green would mean giving the
      # runner a second, weaker definition of "verified" than the local one — and a
      # corpus whose whole claim is that a citation was read at a declared revision
      # cannot afford two definitions of that.
      #
      # So verification stays LOCAL (`--check --strict-citations`, which writes
      # docs/diagrams/VERIFICATION.md), and this runner gates its FRESHNESS: the
      # third step below recomputes the declared revisions from the topics —
      # frontmatter only, no source access — and refuses a VERIFICATION.md written
      # against a different set. A topic re-stamped without its citations being
      # re-resolved therefore cannot reach main. See docs/diagrams/README.md
      # § Where the citation gate runs.
      - name: Structural check (sibling paths tolerated)
        run: node scripts/diagram-index-gen.cjs docs/diagrams --check --no-source-paths

      - name: Citation refusal, allowlist and ADR namespace regression
        run: node tests/gates/diagram-index.test.cjs

      # Asserts the local --strict-citations run was actually done against the
      # revisions the tree declares now, and that citation-allowlist.json is well
      # formed and names real topics. Needs no sibling checkouts.
      - name: Verification report is fresh, allowlist is well formed
        run: node scripts/diagram-index-gen.cjs docs/diagrams --check --no-source-paths --check-verification

      - name: Index in sync
        run: |
          cp docs/diagrams/COVERAGE.md /tmp/COVERAGE.before
          node scripts/diagram-index-gen.cjs docs/diagrams --no-source-paths
          diff -q /tmp/COVERAGE.before docs/diagrams/COVERAGE.md || { echo "::error::COVERAGE.md is stale — run: node scripts/diagram-index-gen.cjs docs/diagrams"; exit 1; }
