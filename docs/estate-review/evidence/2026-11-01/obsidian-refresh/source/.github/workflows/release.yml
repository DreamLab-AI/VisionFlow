name: Plugin release
on: {push: {tags: ['[0-9]*']}}
permissions: {contents: write, id-token: write, attestations: write}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Check tag matches plugin version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== require("./manifest.json").version) process.exit(1)'
      - run: npm ci --include=dev
      - run: npm run build && npm test && npm run test:wasm && npm run check:bundle && npm run test:offline
      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
      - name: Publish installable plugin files
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: gh release create "$GITHUB_REF_NAME" dist/main.js dist/manifest.json dist/styles.css --verify-tag --generate-notes
