<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 1106 831" width="1106" height="831" style="--_bg:#fff;--_fg:#1f1f1f;--_m:#6e6e6e;--_l:#1f1f1f;--_s:#f3f3f3;--_a:#e6e6e6;--_b:#8a8a8a;--_c:#5b7bd5;color:#1f1f1f;--_r:4px;--_fm:monospace;font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:sans-serif" fill="#1f1f1f" role="graphics-document document" aria-roledescription="flowchart"><g class="pele-edges" fill="none" stroke="#1f1f1f" stroke-linecap="round"><g class="pele-edge" data-id="L_CFG_CARD_0"><path d="M179.52,200L179.52,287"/><path class="pele-marker" d="M179.52,294L176.16,286L182.88,286Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge" data-id="L_CARD_SUB_0"><path d="M245.46,423L245.46,489.5C245.46,493.34 627.15,501.03 627.15,504.88L627.15,510"/><path class="pele-marker" d="M627.15,517L623.79,509L630.51,509Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge" data-id="L_SUB_SWPUSH_0"><path d="M687.41,646L687.41,687"/><path class="pele-marker" d="M687.41,694L684.05,686L690.77,686Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge" data-id="L_CARD_PREFS_0"><path d="M113.58,423L113.58,510"/><path class="pele-marker" d="M113.58,517L110.22,509L116.94,509Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge" data-id="L_LOCAL_SHOWN_0"><path d="M445.82,200L445.82,318.5" stroke-dasharray="3 4"/><path class="pele-marker" d="M445.82,325.5L442.46,317.5L449.18,317.5Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge" data-id="L_OUT_SUB_0"><path d="M716.11,444L716.11,510" stroke-dasharray="3 4"/><path class="pele-marker" d="M716.11,517L712.75,509L719.47,509Z" fill="#1f1f1f" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_CARD_SUB_0"><rect x="206.05" y="466.5" width="78.81" height="21" rx="3" fill="#fff"/><text x="245.46" y="481.9" text-anchor="middle">Push mode</text></g><g class="pele-edge-label" data-id="L_CARD_PREFS_0"><rect x="41.1" y="466.5" width="144.95" height="21" rx="3" fill="#fff"/><text x="113.58" y="481.9" text-anchor="middle">registered Push mode</text></g><g class="pele-edge-label" data-id="L_LOCAL_SHOWN_0"><rect x="366.74" y="222.5" width="158.15" height="21" rx="3" fill="#fff"/><text x="445.82" y="237.9" text-anchor="middle">showNotification directly</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="CFG" transform="translate(179.52,146)"><rect x="-110.94" y="-54" width="221.87" height="108" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9">GET /api/push/config - the</tspan><tspan x="0" y="-4.9">client learns whether the</tspan><tspan x="0" y="16.1">relay has push on, so no</tspan><tspan x="0" y="37.1">rebuild is needed</tspan></text></g><g class="pele-node pele-shape-rect" data-id="CARD" transform="translate(179.52,358.5)"><rect x="-112.27" y="-64.5" width="224.54" height="129" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-36.4">Settings selects Push,</tspan><tspan x="0" y="-15.4">LocalOnly Browser alerts,</tspan><tspan x="0" y="5.6">or Hidden</tspan><tspan x="0" y="26.6">server push being off does</tspan><tspan x="0" y="47.6">not hide local alerts</tspan></text></g><g class="pele-node pele-shape-rect" data-id="SUB" transform="translate(687.41,581.5)"><rect x="-112.26" y="-64.5" width="224.51" height="129" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-36.4">enable subscribes this</tspan><tspan x="0" y="-15.4">device and registers it with</tspan><tspan x="0" y="5.6">a NIP-98 signed POST</tspan><tspan x="0" y="26.6">/api/push/subscribe</tspan><tspan x="0" y="47.6"> </tspan></text></g><g class="pele-node pele-shape-rect" data-id="PREFS" transform="translate(113.58,581.5)"><rect x="-105.58" y="-64.5" width="211.15" height="129" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-36.4">server-side prefs: replies</tspan><tspan x="0" y="-15.4">and DMs on, topics and</tspan><tspan x="0" y="5.6">posts off, mutes, quiet</tspan><tspan x="0" y="26.6">hours</tspan><tspan x="0" y="47.6"> </tspan></text></g><g class="pele-node pele-shape-rect" data-id="SWPUSH" transform="translate(687.41,758.5)"><rect x="-99.81" y="-64.5" width="199.62" height="129" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-36.4">service worker push</tspan><tspan x="0" y="-15.4">handler: the push is</tspan><tspan x="0" y="5.6">EMPTY, so it drains</tspan><tspan x="0" y="26.6">counters from the relay</tspan><tspan x="0" y="47.6"> </tspan></text></g><g class="pele-node pele-shape-rect" data-id="LOCAL" transform="translate(445.82,146)"><rect x="-112.25" y="-54" width="224.5" height="108" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9">Tier 0 local alert only while</tspan><tspan x="0" y="-4.9">the page is hidden,</tspan><tspan x="0" y="16.1">permission granted and</tspan><tspan x="0" y="37.1">server push inactive</tspan></text></g><g class="pele-node pele-shape-rect" data-id="OUT" transform="translate(716.11,358.5)"><rect x="-116.26" y="-85.5" width="232.51" height="171" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-57.4">logout attempts token</tspan><tspan x="0" y="-36.4">deletion and browser</tspan><tspan x="0" y="-15.4">cleanup</tspan><tspan x="0" y="5.6">registration never writes the</tspan><tspan x="0" y="26.6">localStorage credential</tspan><tspan x="0" y="47.6">copy it reads</tspan><tspan x="0" y="68.6"> </tspan></text></g><g class="pele-node pele-shape-rect" data-id="SHOWN" transform="translate(445.82,358.5)"><rect x="-114.03" y="-33" width="228.06" height="66" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Generic system notification</tspan><tspan x="0" y="16.1">through worker registration</tspan></text></g><g class="pele-node pele-shape-rect" data-id="N1" transform="translate(713.89,104)"><rect x="-115.82" y="-96" width="231.65" height="192" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-67.9">The empty push body</tspan><tspan x="0" y="-46.9">carries no message text,</tspan><tspan x="0" y="-25.9">author key or channel ID</tspan><tspan x="0" y="-4.9">the service worker fetches</tspan><tspan x="0" y="16.1">generic counters; see</tspan><tspan x="0" y="37.1">NF-18 for metadata and</tspan><tspan x="0" y="58.1">receipt limits</tspan><tspan x="0" y="79.1">ADR-2023 decision 1 and 2</tspan></text></g><g class="pele-node pele-shape-rect" data-id="N2" transform="translate(983.77,125)"><rect x="-114.06" y="-75" width="228.11" height="150" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-46.9">OPEN: ADR-2023 is</tspan><tspan x="0" y="-25.9">accepted and complete but</tspan><tspan x="0" y="-4.9">activation is staged - the</tspan><tspan x="0" y="16.1">relay ships</tspan><tspan x="0" y="37.1">PUSH_ENABLED false</tspan><tspan x="0" y="58.1">- see NF-08.8</tspan></text></g></g></svg>