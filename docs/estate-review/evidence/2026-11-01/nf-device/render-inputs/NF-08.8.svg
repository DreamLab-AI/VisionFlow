36.4">binding and decides</tspan><tspan x="0" y="-15.4">ALONE - no cross-worker</tspan><tspan x="0" y="5.6">call.</tspan><tspan x="0" y="26.6">Only the parse rule is</tspan><tspan x="0" y="47.6">shared, so the two cannot</tspan><tspan x="0" y="68.6">drift on what true means</tspan><tspan x="0" y="89.6">nostr-bbs-auth-worker/src/devices.rs:100-107</tspan></text></g><g class="pele-node pele-shape-rect" data-id="N2" transform="translate(204.74,1087.5)"><rect x="-165.15" y="-75" width="330.3" height="150" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-46.9">INVARIANT: enables on the</tspan><tspan x="0" y="-25.9">EXACT string true; unset,</tspan><tspan x="0" y="-4.9">empty or anything else is off</tspan><tspan x="0" y="16.1">nostr-bbs-auth-worker/src/devices.rs:112,</tspan><tspan x="0" y="37.1">asserted</tspan><tspan x="0" y="58.1">nostr-bbs-auth-worker/src/devices.rs:974</tspan></text></g><g class="pele-node pele-shape-rect" data-id="N3" transform="translate(198.97,1267)"><rect x="-170.92" y="-64.5" width="341.84" height="129" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-36.4">AUTH_MODE: anything</tspan><tspan x="0" y="-15.4">other than allowlist resolves</tspan><tspan x="0" y="5.6">to the secure nip42 default</tspan><tspan x="0" y="26.6">nostr-bbs-relay-worker/wrangler.toml:37-39</tspan><tspan x="0" y="47.6">- see NF-03</tspan></text></g><g class="pele-node pele-shape-rect" data-id="N4" transform="translate(198.97,1478)"><rect x="-170.92" y="-106.5" width="341.84" height="213" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-78.4">ESCALATION_DEFAULT_TIER</tspan><tspan x="0" y="-57.4">is a declared SCAFFOLD -</tspan><tspan x="0" y="-36.4">the authoritative risk-tier</tspan><tspan x="0" y="-15.4">schema is owned by</tspan><tspan x="0" y="5.6">agentbox, EXTERNAL: see</tspan><tspan x="0" y="26.6">AB-14 and AB-15; an</tspan><tspan x="0" y="47.6">unrecognised tier folds to</tspan><tspan x="0" y="68.6">medium</tspan><tspan x="0" y="89.6">nostr-bbs-relay-worker/wrangler.toml:54-61</tspan></text></g><g class="pele-node pele-shape-rect" data-id="N5" transform="translate(198.97,1762.5)"><rect x="-170.92" y="-138" width="341.84" height="276" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-109.9">INVARIANT: calibration</tspan><tspan x="0" y="-88.9">sampling is HMAC over a</tspan><tspan x="0" y="-67.9">key the agent cannot read.</tspan><tspan x="0" y="-46.9">The request id is the</tspan><tspan x="0" y="-25.9">31402 d tag, which the</tspan><tspan x="0" y="-4.9">agent chooses, so the key</tspan><tspan x="0" y="16.1">secrecy is the only thing</tspan><tspan x="0" y="37.1">stopping it grinding tags</tspan><tspan x="0" y="58.1">until it finds one sampling</tspan><tspan x="0" y="79.1">never selects</tspan><tspan x="0" y="100.1">nostr-bbs-relay-worker/wrangler.toml:69-74</tspan><tspan x="0" y="121.1">- see NF-12</tspan></text></g><g class="pele-node pele-shape-rect" data-id="N6" transform="translate(198.97,2026)"><rect x="-170.92" y="-85.5" width="341.84" height="171" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-57.4">Unset, the relay STILL</tspan><tspan x="0" y="-36.4">samples and logs a warning</tspan><tspan x="0" y="-15.4">on every projection - silently</tspan><tspan x="0" y="5.6">disabling</tspan><tspan x="0" y="26.6">oversight is treated as the</tspan><tspan x="0" y="47.6">worse failure</tspan><tspan x="0" y="68.6">nostr-bbs-relay-worker/wrangler.toml:76-79</tspan></text></g><g class="pele-node pele-shape-rect" data-id="PUSH" transform="translate(210.53,2258)"><rect x="-159.36" y="-106.5" width="318.72" height="213" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-78.4">relay-worker</tspan><tspan x="0" y="-57.4">PUSH_ENABLED=false,</tspan><tspan x="0" y="-36.4">ADR-2023 content-free</tspan><tspan x="0" y="-15.4">Web Push, off by default</tspan><tspan x="0" y="5.6">nostr-bbs-relay-worker/wrangler.toml:86</tspan><tspan x="0" y="26.6">with VAPID_PUBLIC_KEY</tspan><tspan x="0" y="47.6">nostr-bbs-relay-worker/wrangler.toml:87</tspan><tspan x="0" y="68.6">and PUSH_MAX_FANOUT</tspan><tspan x="0" y="89.6">nostr-bbs-relay-worker/wrangler.toml:90</tspan></text></g><g class="pele-node pele-shape-rect" data-id="RURL" transform="translate(198.97,2479.5)"><rect x="-170.92" y="-75" width="341.84" height="150" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-46.9">RELAY_URL is blank by</tspan><tspan x="0" y="-25.9">default, and required in</tspan><tspan x="0" y="-4.9">nip42 mode: blank logs a</tspan><tspan x="0" y="16.1">console error on every</tspan><tspan x="0" y="37.1">AUTH</tspan><tspan x="0" y="58.1">nostr-bbs-relay-worker/wrangler.toml:48-51</tspan></text></g><g class="pele-node pele-shape-rect" data-id="N8" transform="translate(188.94,2858.5)"><rect x="-180.94" y="-264" width="361.89" height="528" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-235.9">All three templates now</tspan><tspan x="0" y="-214.9">ship System One advisory</tspan><tspan x="0" y="-193.9">flags ON (relay</tspan><tspan x="0" y="-172.9">JEV_TRIAGE=1</tspan><tspan x="0" y="-151.9">nostr-bbs-relay-worker/wrangler.toml:11,</tspan><tspan x="0" y="-130.9">search</tspan><tspan x="0" y="-109.9">JEV_SEARCH_RERANK=1</tspan><tspan x="0" y="-88.9">nostr-bbs-search-worker/wrangler.toml:32,</tspan><tspan x="0" y="-67.9">auth</tspan><tspan x="0" y="-46.9">JEV_RATIONALE_CHECK=1</tspan><tspan x="0" y="-25.9">nostr-bbs-auth-worker/wrangler.toml:53)</tspan><tspan x="0" y="-4.9">pointing at TypeSafe</tspan><tspan x="0" y="16.1">jev-latest</tspan><tspan x="0" y="37.1">(nostr-bbs-relay-worker/wrangler.toml:12-13);</tspan><tspan x="0" y="58.1">TYPESAFE_API_KEY is a</tspan><tspan x="0" y="79.1">Worker secret named at :14</tspan><tspan x="0" y="100.1">and never a plaintext var,</tspan><tspan x="0" y="121.1">and the auth worker</tspan><tspan x="0" y="142.1">declares no endpoint, so it</tspan><tspan x="0" y="163.1">resolves to TypeSafe</tspan><tspan x="0" y="184.1">through the same secret</tspan><tspan x="0" y="205.1">and stays private only when</tspan><tspan x="0" y="226.1">JEV_RATIONALE_CHECK_LOCAL_ONLY=1</tspan><tspan x="0" y="247.1">(nostr-bbs-auth-worker/wrangler.toml:54-58)</tspan></text></g><g class="pele-node pele-shape-rect" data-id="N7" transform="translate(252.75,3258.5)"><rect x="-117.14" y="-96" width="234.27" height="192" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-67.9">A second lockstep gate,</tspan><tspan x="0" y="-46.9">ENCRYPTION_ENABLED,</tspan><tspan x="0" y="-25.9">follows the same</tspan><tspan x="0" y="-4.9">own-binding pattern across</tspan><tspan x="0" y="16.1">relay</tspan><tspan x="0" y="37.1">and clients but is</tspan><tspan x="0" y="58.1">undeclared in every</tspan><tspan x="0" y="79.1">wrangler.toml - see NF-08.2</tspan></text></g></g></svg>