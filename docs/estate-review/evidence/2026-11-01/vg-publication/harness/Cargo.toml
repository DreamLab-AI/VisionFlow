[package]
name = "vg-publication-audit"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
async-trait = "0.1"
bytes = "1"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
solid-pod-rs = { version = "=0.5.0-alpha.17", default-features = false, features = ["fs-backend", "memory-backend"] }
uuid = { version = "1", features = ["v4"] }
[dev-dependencies]
tempfile = "3"
