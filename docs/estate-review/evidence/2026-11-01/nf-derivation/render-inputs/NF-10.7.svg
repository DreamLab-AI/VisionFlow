<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 2240 565" width="2240" height="565" style="--_bg:#fff;--_fg:#1f1f1f;--_m:#6e6e6e;--_l:#1f1f1f;--_s:#f3f3f3;--_a:#e6e6e6;--_b:#8a8a8a;--_c:#5b7bd5;color:#1f1f1f;--_r:4px;--_fm:monospace;font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:sans-serif" fill="#1f1f1f" role="graphics-document document" aria-roledescription="flowchart"><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="S1" transform="translate(155.8,282.5)"><rect x="-147.8" y="-274.5" width="295.6" height="549" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-246.4">The relay events table was</tspan><tspan x="0" y="-225.4">created only by a</tspan><tspan x="0" y="-204.4">SETUP.md copy-paste -</tspan><tspan x="0" y="-183.4">CLOSED in two steps.</tspan><tspan x="0" y="-162.4">1a26e51: whitelist got its</tspan><tspan x="0" y="-141.4">first DDL, migration</tspan><tspan x="0" y="-120.4">0008_whitelist.sql:30,</tspan><tspan x="0" y="-99.4">run first by ensure_schema</tspan><tspan x="0" y="-78.4">nostr-bbs-relay-worker/src/lib.rs:841</tspan><tspan x="0" y="-57.4">before the ALTER list</tspan><tspan x="0" y="-36.4">nostr-bbs-relay-worker/src/lib.rs:890.</tspan><tspan x="0" y="-15.4">66ca8d8: migration</tspan><tspan x="0" y="5.6">0009_events.sql:23 creates</tspan><tspan x="0" y="26.6">events</tspan><tspan x="0" y="47.6">and ensure_schema</tspan><tspan x="0" y="68.6">creates it first,</tspan><tspan x="0" y="89.6">nostr-bbs-relay-worker/src/lib.rs:823,</tspan><tspan x="0" y="110.6">so SETUP.md now points</tspan><tspan x="0" y="131.6">at the migration</tspan><tspan x="0" y="152.6">SETUP.md:100 instead of</tspan><tspan x="0" y="173.6">carrying the DDL.</tspan><tspan x="0" y="194.6">Residual: the auth schema</tspan><tspan x="0" y="215.6">is still pasted SQL</tspan><tspan x="0" y="236.6">SETUP.md:75. See</tspan><tspan x="0" y="257.6">NF-08.6.</tspan></text></g><g class="pele-node pele-shape-rect" data-id="S2" transform="translate(460.31,282.5)"><rect x="-116.71" y="-106.5" width="233.42" height="213" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-78.4">ADMIN_PUBKEYS is read</tspan><tspan x="0" y="-57.4">by auth and relay but</tspan><tspan x="0" y="-36.4">declared in neither template</tspan><tspan x="0" y="-15.4">and named in no SETUP</tspan><tspan x="0" y="5.6">step</tspan><tspan x="0" y="26.6">SETUP.md:147. A</tspan><tspan x="0" y="47.6">by-the-book deployment</tspan><tspan x="0" y="68.6">has no static admin</tspan><tspan x="0" y="89.6">bootstrap. See NF-08.7.</tspan></text></g><g class="pele-node pele-shape-rect" data-id="S3" transform="translate(788.83,282.5)"><rect x="-171.81" y="-169.5" width="343.62" height="339" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-141.4">The preview worker's SSRF</tspan><tspan x="0" y="-120.4">guard is denylist-only</tspan><tspan x="0" y="-99.4">without</tspan><tspan x="0" y="-78.4">PREVIEW_ALLOWED_HOSTS,</tspan><tspan x="0" y="-57.4">which the template</tspan><tspan x="0" y="-36.4">never sets</tspan><tspan x="0" y="-15.4">nostr-bbs-preview-worker/wrangler.toml:13.</tspan><tspan x="0" y="5.6">The code says so itself - the</tspan><tspan x="0" y="26.6">Workers runtime exposes</tspan><tspan x="0" y="47.6">no</tspan><tspan x="0" y="68.6">resolve-then-pin primitive</tspan><tspan x="0" y="89.6">nostr-bbs-preview-worker/src/ssrf.rs:13</tspan><tspan x="0" y="110.6">- and there is no wall-clock</tspan><tspan x="0" y="131.6">timeout.</tspan><tspan x="0" y="152.6">See NF-07.6.</tspan></text></g><g class="pele-node pele-shape-rect" data-id="S4" transform="translate(1162.22,282.5)"><rect x="-161.58" y="-117" width="323.17" height="234" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-88.9">DEVICE_KEYS_ENABLED</tspan><tspan x="0" y="-67.9">ships false in BOTH</tspan><tspan x="0" y="-46.9">templates</tspan><tspan x="0" y="-25.9">nostr-bbs-auth-worker/wrangler.toml:69</tspan><tspan x="0" y="-4.9">nostr-bbs-relay-worker/wrangler.toml:29,</tspan><tspan x="0" y="16.1">so the whole ADR-099/100</tspan><tspan x="0" y="37.1">device story is dormant by</tspan><tspan x="0" y="58.1">default and</tspan><tspan x="0" y="79.1">revocation has no effect at</tspan><tspan x="0" y="100.1">AUTH. See NF-02.7.</tspan></text></g><g class="pele-node pele-shape-rect" data-id="S5" transform="translate(1525.39,282.5)"><rect x="-161.58" y="-106.5" width="323.17" height="213" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-78.4">MESH_ALLOWED_REMOTE_DIDS</tspan><tspan x="0" y="-57.4">ships empty</tspan><tspan x="0" y="-36.4">nostr-bbs-relay-worker/wrangler.toml:96,</tspan><tspan x="0" y="-15.4">so the federated-kind gate</tspan><tspan x="0" y="5.6">at</tspan><tspan x="0" y="26.6">nip_handlers.rs:3590 is</tspan><tspan x="0" y="47.6">inert. Standalone is the only</tspan><tspan x="0" y="68.6">supported mode. See</tspan><tspan x="0" y="89.6">NF-03.13.</tspan></text></g><g class="pele-node pele-shape-rect" data-id="S6" transform="translate(1843.25,282.5)"><rect x="-116.27" y="-127.5" width="232.54" height="255" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-99.4">drift-gates runs parity and</tspan><tspan x="0" y="-78.4">lint.</tspan><tspan x="0" y="-57.4">ci-pass omits it from needs.</tspan><tspan x="0" y="-36.4">External branch rules are</tspan><tspan x="0" y="-15.4">separate;</tspan><tspan x="0" y="5.6">see dated report.</tspan><tspan x="0" y="26.6">Workflow path filters apply.</tspan><tspan x="0" y="47.6">No paired agentbox release</tspan><tspan x="0" y="68.6">ref is set.</tspan><tspan x="0" y="89.6">See NF-21 for</tspan><tspan x="0" y="110.6">source-check limits.</tspan></text></g><g class="pele-node pele-shape-rect" data-id="S7" transform="translate(2115.34,282.5)"><rect x="-115.82" y="-138" width="231.63" height="276" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-109.9">ADR-2019 parent-coin view</tspan><tspan x="0" y="-88.9">needs</tspan><tspan x="0" y="-67.9">SIDESTR_WALLET and an</tspan><tspan x="0" y="-46.9">HTTPS backend.</tspan><tspan x="0" y="-25.9">No backend means no</tspan><tspan x="0" y="-4.9">request.</tspan><tspan x="0" y="16.1">Public-key address only; no</tspan><tspan x="0" y="37.1">parent spend.</tspan><tspan x="0" y="58.1">Backend-reported, not</tspan><tspan x="0" y="79.1">browser-validated.</tspan><tspan x="0" y="100.1">See NF-16 for parser and</tspan><tspan x="0" y="121.1">loading limits.</tspan></text></g></g></svg>