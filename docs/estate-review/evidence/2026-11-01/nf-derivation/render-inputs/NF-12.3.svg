Shared vectors test</tspan><tspan x="0" y="-4.9">compatibility</tspan><tspan x="0" y="16.1">for fixed valid roots and</tspan><tspan x="0" y="37.1">exact tags</tspan></text></g><g class="pele-node pele-shape-rect" data-id="J" transform="translate(651.98,218)"><rect x="-107.81" y="-54" width="215.62" height="108" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9">JS runner mirrors the</tspan><tspan x="0" y="-4.9">expression</tspan><tspan x="0" y="16.1">source substring check is</tspan><tspan x="0" y="37.1">not consumer execution</tspan></text></g><g class="pele-node pele-shape-rect" data-id="R" transform="translate(909.82,218)"><rect x="-110.03" y="-33" width="220.06" height="66" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Root possession recovers</tspan><tspan x="0" y="16.1">each known-tag child</tspan></text></g><g class="pele-node pele-shape-rect" data-id="C" transform="translate(909.82,409.5)"><rect x="-112.28" y="-64.5" width="224.56" height="129" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-36.4">Child-only and root</tspan><tspan x="0" y="-15.4">exposure are separate</tspan><tspan x="0" y="5.6">cases</tspan><tspan x="0" y="26.6">tag changes do not revoke</tspan><tspan x="0" y="47.6">old authority</tspan></text></g></g></svg>