ime selects known pins</tspan><tspan x="0" y="5.6">unknown chains are</tspan><tspan x="0" y="26.6">ignored</tspan></text></g><g class="pele-node pele-shape-rect" data-id="C" transform="translate(122.92,332)"><rect x="-114.92" y="-54" width="229.84" height="108" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9">DEBT: asset override also</tspan><tspan x="0" y="-4.9">changes DREAM</tspan><tspan x="0" y="16.1">while its default ticker stays</tspan><tspan x="0" y="37.1">DREAM</tspan></text></g><g class="pele-node pele-shape-rect" data-id="D" transform="translate(384.32,332)"><rect x="-106.48" y="-54" width="212.96" height="108" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9">Typed entry parse failure</tspan><tspan x="0" y="-4.9">drops the entry</tspan><tspan x="0" y="16.1">if no entries survive, use</tspan><tspan x="0" y="37.1">DREAM</tspan></text></g><g class="pele-node pele-shape-rect" data-id="E" transform="translate(634.6,321.5)"><rect x="-103.8" y="-43.5" width="207.6" height="87" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4">DEBT: URL checks only</tspan><tspan x="0" y="5.6">inspect prefixes</tspan><tspan x="0" y="26.6">invalid hosts can pass</tspan></text></g></g></svg>