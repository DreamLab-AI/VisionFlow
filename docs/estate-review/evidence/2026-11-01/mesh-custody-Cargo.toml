[package]
name = "mesh-custody-audit"
version = "0.1.0"
edition = "2021"
[dependencies]
nostr-bbs-core = {path = "/home/devuser/workspace/nostr-rust-forum/crates/nostr-bbs-core"}
nostr-bbs-mesh = {path = "/home/devuser/workspace/nostr-rust-forum/crates/nostr-bbs-mesh"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1", features = ["preserve_order"]}
tokio = {version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"]}
anyhow = "1"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
url = "2"
base64 = "0.22"
zeroize = "1"
k256 = "0.13"
toml = "1"
tracing = "0.1"
tempfile = "3"
bech32 = "0.12"
age = {version = "0.12", features = ["armor"]}
tar = "0.4"
clap = {version = "4", features = ["derive"]}
walkdir = "2"
