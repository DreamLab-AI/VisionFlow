ight="16" rx="8" fill="#1f1f1f" stroke="none"/><text x="2420.74" y="542.2" text-anchor="middle" font-size="12" fill="#fff" stroke="none">12</text></g></g><g class="pele-edge pele-message" data-id="i13"><path d="M331.19,590H3380.67"/><path class="pele-marker" d="M3387.67,590L3379.67,593.36L3379.67,586.64Z" fill="#1f1f1f" stroke="none"/><g class="pele-sequence-number"><rect x="309.85" y="582" width="21.34" height="16" rx="8" fill="#1f1f1f" stroke="none"/><text x="320.52" y="594.2" text-anchor="middle" font-size="12" fill="#fff" stroke="none">13</text></g></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="i1"><text x="164.26" y="95.4" text-anchor="middle">REQ sub id, filters</text></g><g class="pele-edge-label" data-id="i2"><text x="912.52" y="132.4" text-anchor="middle">do these filters NAME a protected kind nip_handlers.rs:1826</text></g><g class="pele-edge-label" data-id="i3"><text x="744.26" y="169.4" text-anchor="middle">CLOSED auth-required when they do nip_handlers.rs:1827</text></g><g class="pele-edge-label" data-id="i4"><text x="592.91" y="208.9" text-anchor="middle">gate_kind_1059_filters rewrites the mandatory p tag nip_handlers.rs:1838</text></g><g class="pele-edge-label" data-id="i5"><text x="583.34" y="244.9" text-anchor="middle">store the GATED filter, never the client's raw one nip_handlers.rs:1857</text></g><g class="pele-edge-label" data-id="i6"><text x="544.67" y="280.9" text-anchor="middle">query_events against the gated filter nip_handlers.rs:1865</text></g><g class="pele-edge-label" data-id="i7"><text text-anchor="middle" xml:space="preserve"><tspan x="1135.9" y="312.9">ADR-2018: memoised cached_viewer_cohorts + admin check, once per REQ</tspan><tspan x="1135.9" y="330.9">nip_handlers.rs:1873 nip_handlers.rs:2168</tspan></text></g><g class="pele-edge-label" data-id="i8"><text x="913.52" y="368.9" text-anchor="middle">a kind-1059 wrap is delivered only to the recipient named in its p tag, checked per event before authorize_event gift_wrap_readable_by nip_handlers.rs:156 nip_handlers.rs:1880</text></g><g class="pele-edge-label" data-id="i9"><rect x="1196.54" y="389" width="356.18" height="32" rx="3" fill="#fff" stroke="none"/><text text-anchor="middle" xml:space="preserve"><tspan x="1374.63" y="400.9">every returned event, one at a time, against the resolved</tspan><tspan x="1374.63" y="418.9">ViewerContext nip_handlers.rs:1883</tspan></text></g><g class="pele-edge-label" data-id="i10"><text x="2688.38" y="454.4" text-anchor="middle">kind, author, p recipients, viewer, mode nip_handlers.rs:2280</text></g><g class="pele-edge-label" data-id="i11"><text x="2677.71" y="491.4" text-anchor="middle">correspondence needs a party to it, moderation needs only auth nip42.rs:85</text></g><g class="pele-edge-label" data-id="i12"><rect x="1206.28" y="515" width="318.03" height="17" rx="3" fill="#fff" stroke="none"/><text x="1365.3" y="528.4" text-anchor="middle">Withhold when not permitted nip_handlers.rs:2287</text></g><g class="pele-edge-label" data-id="i13"><rect x="1642.05" y="552" width="434.76" height="32" rx="3" fill="#fff" stroke="none"/><text text-anchor="middle" xml:space="preserve"><tspan x="1859.43" y="563.9">note_read_activity - only for delivered events, batched into the SAME</tspan><tspan x="1859.43" y="581.9">coalesced flush as writes nip_handlers.rs:1914 nip_handlers.rs:2228</tspan></text></g></g><g class="pele-notes" font-size="14" fill="#e6e6e6" stroke="#8a8a8a"><g class="pele-note" data-id="i14"><rect x="78.26" y="600" width="484.52" height="84" style="rx:4px"/><text class="pele-label" stroke="none" fill="#1f1f1f" text-anchor="middle" xml:space="preserve"><tspan x="320.52" y="619.9">INVARIANT ordering is load-bearing - both gates run BEFORE the</tspan><tspan x="320.52" y="637.9">subscription is stored. The previous order stored the raw filter, so a refused</tspan><tspan x="320.52" y="655.9">historical read still delivered every later matching event live</tspan><tspan x="320.52" y="673.9">nip_handlers.rs:1826-1862</tspan></text></g><g class="pele-note" data-id="i15"><rect x="2170.69" y="694" width="500.1" height="66" style="rx:4px"/><text class="pele-label" stroke="none" fill="#1f1f1f" text-anchor="middle" xml:space="preserve"><tspan x="2420.74" y="713.9">INVARIANT the protected check is per EVENT, not per filter - a</tspan><tspan x="2420.74" y="731.9">filter that omits kinds matches every kind while naming none and passed both</tspan><tspan x="2420.74" y="749.9">filter gates nip_handlers.rs:2268-2272</tspan></text></g><g class="pele-note" data-id="i16"><rect x="1711.93" y="770" width="462.71" height="66" style="rx:4px"/><text class="pele-label" stroke="none" fill="#1f1f1f" text-anchor="middle" xml:space="preserve"><tspan x="1943.29" y="789.9">DRIFT resolved: has_zone_access (a per-event D1 read) was removed</tspan><tspan x="1943.29" y="807.9">from trust.rs — zone_read_permitted decides purely from the cached</tspan><tspan x="1943.29" y="825.9">ViewerContext instead trust.rs:640-642 nip_handlers.rs:2114</tspan></text></g><g class="pele-note" data-id="i17"><rect x="2168.75" y="846" width="503.99" height="48" style="rx:4px"/><text class="pele-label" stroke="none" fill="#1f1f1f" text-anchor="middle" xml:space="preserve"><tspan x="2420.74" y="865.9">Zone memo caches only positive bindings - an unbound channel still reads D1</tspan><tspan x="2420.74" y="883.9">nip_handlers.rs:2189-2198 — see NF-17 for cost and failure boundaries</tspan></text></g><g class="pele-note" data-id="i18"><rect x="2702.3" y="904" width="486.09" height="66" style="rx:4px"/><text class="pele-label" stroke="none" fill="#1f1f1f" text-anchor="middle" xml:space="preserve"><tspan x="2945.34" y="923.9">The two halves of the protected set have different rules - a</tspan><tspan x="2945.34" y="941.9">moderation event is readable by the membership, a DM only by a party to it</tspan><tspan x="2945.34" y="959.9">nip42.rs:53-60</tspan></text></g></g><g class="pele-nodes"><g 