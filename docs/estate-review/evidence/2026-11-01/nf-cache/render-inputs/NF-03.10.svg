 y="771.9">Disabled fan-out returns at once push_fanout.rs:48</tspan><tspan x="1692.94" y="789.9">Candidates use the shared read gate push_fanout.rs:94</tspan></text></g><g class="pele-note" data-id="i22"><rect x="-16" y="810" width="563.68" height="66" style="rx:4px"/><text class="pele-label" stroke="none" fill="#1f1f1f" text-anchor="middle" xml:space="preserve"><tspan x="265.84" y="829.9">ADR-2010: the relay OK certifies storage only.</tspan><tspan x="265.84" y="847.9">Without projection-committed, the response is accepted</tspan><tspan x="265.84" y="865.9">but not applied - reported separately nip_handlers.rs:1630-1642</tspan></text></g><g class="pele-note" data-id="i23"><rect x="515.68" y="886" width="361.6" height="84" style="rx:4px"/><text class="pele-label" stroke="none" fill="#1f1f1f" text-anchor="middle" xml:space="preserve"><tspan x="696.48" y="905.9">Reads and writes share this ledger.</tspan><tspan x="696.48" y="923.9">A later activity call triggers an elapsed-window flush.</tspan><tspan x="696.48" y="941.9">Pending-read threshold can flush sooner - see NF-17.4</tspan><tspan x="696.48" y="959.9">nip_handlers.rs:2228 nip_handlers.rs:2246-2248</tspan></text></g><g class="pele-note" data-id="i24"><rect x="871.28" y="980" width="370.95" height="48" style="rx:4px"/><text class="pele-label" stroke="none" fill="#1f1f1f" text-anchor="middle" xml:space="preserve"><tspan x="1056.76" y="999.9">Mirror requires an admin on this relay.</tspan><tspan x="1056.76" y="1017.9">A lifted ban must stop enforcement nip_handlers.rs:1588</tspan></text></g><g class="pele-note" data-id="i25"><rect x="1178.43" y="1038" width="270.59" height="48" style="rx:4px"/><text class="pele-label" stroke="none" fill="#1f1f1f" text-anchor="middle" xml:space="preserve"><tspan x="1313.72" y="1057.9">External human-approval workflow</tspan><tspan x="1313.72" y="1075.9">spans the estate - see ES-05 and AB-14</tspan></text></g></g><g class="pele-nodes"><g class="pele-node pele-actor pele-actor-parti